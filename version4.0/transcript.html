<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Academic Transcript</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #4a90e2;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px;
            background: white;
        }

        .transcript-container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #333;
            padding: 40px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .uni-info h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .uni-info p {
            margin: 5px 0;
            font-weight: 600;
        }

        .student-section {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }

        .student-photo {
            width: 120px;
            height: 150px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            overflow: hidden;
        }

        .student-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-details {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-item label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #777;
            font-weight: bold;
        }

        .detail-item span {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .records-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .records-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .records-table th {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 12px;
            font-size: 0.85rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .records-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }

        .records-table tr:last-child td {
            border-bottom: none;
        }

        .semester-header {
            background: var(--primary-color) !important;
            color: white !important;
            font-weight: 700 !important;
            text-align: center !important;
        }

        .light-blue {
            background-color: #deeaf6 !important;
        }

        .summary-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 40px;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            border-right: 1px solid #eee;
        }
        .summary-table th:last-child, .summary-table td:last-child {
            border-right: none;
        }
        .summary-table tr:last-child td {
            border-bottom: none;
        }

        .footer {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .footer-bottom {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .signature-block {
            text-align: center;
            width: 200px;
        }

        .signature-line {
            border-top: 1px solid #333;
            margin-bottom: 5px;
        }

        @media print {
            @page { margin: 10mm; } /* Reducing margins often helps hide browser headers/footers */
            body { padding: 0; }
            .no-print { display: none; }
            .transcript-container { border: none; padding: 0; }
        }

        .btn-print {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        @media print {
            body { 
                padding: 0; 
                background: white; 
            }
            .transcript-container { 
                border: none; 
                padding: 0; 
                width: 100%;
                max-width: none;
            }
            .records-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 15px !important;
            }
            .semester-header {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background-color: var(--primary-color) !important;
                color: white !important;
            }
            .records-table {
                break-inside: avoid;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="no-print" style="text-align: center;">
        <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
        <button class="btn-print" style="background: #4a90e2;" onclick="window.location.href='print.html'">Edit Details</button>
        <button class="btn-print" style="background: #333;" onclick="window.location.href='data.html'">Saved Records</button>
        <button class="btn-print" style="background: #777;" onclick="window.location.href='index.html'">Calculator</button>
    </div>

    <div class="transcript-container">
        <div class="header">
            <div class="uni-info">
                <h1 id="view-uni-name">University Name</h1>
                <p>College: <span id="view-uni-college">College Name</span></p>
                <div>Department: <span id="view-uni-dept">Department Name</span></div>
                <div style="font-size: 0.9rem; color: #666;">Location: <span id="view-uni-location">Location</span></div>
            </div>
        </div>

        <div class="student-section">
            <div class="student-photo" id="view-student-photo">
                <span>No Photo</span>
            </div>
            <div class="student-details">
                <div class="detail-item">
                    <label>Student Name</label>
                    <span id="view-student-name">-</span>
                </div>
                <div class="detail-item">
                    <label>Program / Major</label>
                    <span id="view-student-program">-</span>
                </div>
                <div class="detail-item">
                    <label>Email</label>
                    <span id="view-student-email">-</span>
                </div>
                <div class="detail-item">
                    <label>Phone</label>
                    <span id="view-student-phone">-</span>
                </div>
            </div>
        </div>

        <div id="transcript-content">
            <!-- Tables for each semester will be injected here -->
        </div>

        <div id="summary-section">
            <!-- Dynamic summary table will be injected here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const info = JSON.parse(sessionStorage.getItem('transcriptInfo'));
            const records = JSON.parse(localStorage.getItem('gpaRecords') || '[]');

            if (!info || records.length === 0) {
                alert('Missing information or records!');
                window.location.href = 'index.html';
                return;
            }

            // Fill Info
            document.getElementById('view-uni-name').innerText = info.uni.name;
            document.getElementById('view-uni-college').innerText = info.uni.college;
            document.getElementById('view-uni-dept').innerText = info.uni.dept;
            document.getElementById('view-uni-location').innerText = info.uni.location;

            document.getElementById('view-student-name').innerText = info.student.name;
            document.getElementById('view-student-program').innerText = info.student.program;
            document.getElementById('view-student-email').innerText = info.student.email;
            document.getElementById('view-student-phone').innerText = info.student.phone;
            
            if (info.student.image) {
                document.getElementById('view-student-photo').innerHTML = `<img src="${info.student.image}">`;
            }

            // Sort records
            records.sort((a, b) => {
                const yearA = parseInt(a.year.match(/\d+/)[0]);
                const yearB = parseInt(b.year.match(/\d+/)[0]);
                if (yearA !== yearB) return yearA - yearB;
                const semA = parseInt(a.semester.match(/\d+/)[0]);
                const semB = parseInt(b.semester.match(/\d+/)[0]);
                return semA - semB;
            });

            const content = document.getElementById('transcript-content');
            content.innerHTML = ''; // Clear
            
            // Group records by year
            const yearGroups = {};
            records.forEach(r => {
                if (!yearGroups[r.year]) yearGroups[r.year] = [];
                yearGroups[r.year].push(r);
            });

            // Render by Year
            Object.keys(yearGroups).sort().forEach(yearKey => {
                const yearSection = document.createElement('div');
                yearSection.style.marginBottom = '40px';
                
                const yearHeader = document.createElement('h2');
                yearHeader.innerText = yearKey;
                yearHeader.style.cssText = 'border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.4rem; color: var(--primary-color);';
                yearSection.appendChild(yearHeader);

                const grid = document.createElement('div');
                grid.className = 'records-grid';
                
                yearGroups[yearKey].forEach(record => {
                    const table = document.createElement('table');
                    table.className = 'records-table';
                    
                    let subjectsHtml = record.subjects.map(s => `
                        <tr>
                            <td style="font-weight: 500;">${s.name}</td>
                            <td style="text-align: center;">${s.credit}</td>
                            <td style="text-align: center; font-weight: bold;">${s.grade}</td>
                        </tr>
                    `).join("");

                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th colspan="3" class="semester-header">${record.semester} (GPA: ${record.gpa})</th>
                            </tr>
                            <tr style="background: #f1f5f9; color: #475569; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
                                <th>Course Description</th>
                                <th style="text-align: center; width: 60px;">CR</th>
                                <th style="text-align: center; width: 60px;">GR</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${subjectsHtml}
                        </tbody>
                    `;
                    grid.appendChild(table);
                });
                
                yearSection.appendChild(grid);
                content.appendChild(yearSection);
            });

            // Generate Summary Table
            generateSummaryTable(records);
        });

        function generateSummaryTable(records) {
            const summarySection = document.getElementById('summary-section');
            
            // Group records by year
            const yearGroups = {};
            records.forEach(r => {
                if (!yearGroups[r.year]) yearGroups[r.year] = [];
                yearGroups[r.year].push(r);
            });

            let html = `
                <table class="summary-table">
                    <tr class="light-blue">
                        <th>Year</th>
                        <th>Semester</th>
                        <th>GPA</th>
                        <th>Cumulative</th>
                    </tr>
            `;

            let overallTotalPoints = 0;
            let overallTotalCredits = 0;

            Object.keys(yearGroups).sort().forEach(yearKey => {
                const yearRecords = yearGroups[yearKey];
                let yearTotalPoints = 0;
                let yearTotalCredits = 0;

                yearRecords.forEach((record, index) => {
                    record.subjects.forEach(s => {
                        const pts = getGradePoints(s.grade);
                        yearTotalPoints += pts * parseFloat(s.credit);
                        yearTotalCredits += parseFloat(s.credit);
                        
                        overallTotalPoints += pts * parseFloat(s.credit);
                        overallTotalCredits += parseFloat(s.credit);
                    });

                    const yearCumulative = (yearTotalPoints / yearTotalCredits).toFixed(2);
                    
                    html += `<tr>`;
                    if (index === 0) {
                        html += `<td rowspan="${yearRecords.length}">${yearKey}</td>`;
                    }
                    html += `<td>${record.semester}</td>`;
                    html += `<td>${record.gpa}</td>`;
                    if (index === 0) {
                        html += `<td rowspan="${yearRecords.length}">${yearCumulative}</td>`;
                    }
                    html += `</tr>`;
                });
            });

            const finalCGPA = (overallTotalPoints / overallTotalCredits).toFixed(2);
            html += `
                <tr class="light-blue">
                    <td colspan="3"><b>Total Cumulative GPA</b></td>
                    <td><b>${finalCGPA}</b></td>
                </tr>
            </table>`;

            summarySection.innerHTML = html;
        }

        function getGradePoints(grade) {
            const points = {
                'A+': 4.0, 'A': 4.0, 'A-': 3.75,
                'B+': 3.5, 'B': 3.0, 'B-': 2.75,
                'C+': 2.5, 'C': 2.0, 'C-': 1.75,
                'D': 1.0, 'F': 0.0
            };
            return points[grade] || 0.0;
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Reg Failed', err));
            });
        }
    </script>
</body>
</html>
